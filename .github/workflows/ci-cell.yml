name: CI cell

on:
  workflow_call:
    inputs:
      cell-id:
        required: true
        type: string
      os:
        required: true
        type: string
      c-compiler:
        required: true
        type: string
      cpp-compiler:
        required: true
        type: string
      build-type:
        required: false
        type: string
        default: Release
      toolchain:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build (${{ inputs.cell-id }})
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux' && inputs.c-compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Setup MSYS2 MinGW
        if: runner.os == 'Windows' && inputs.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Configure via prepare_cmake.sh
        shell: bash
        run: |
          set -euo pipefail
          export SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build"
          export SIS_CMAKE_CONFIG="${{ inputs.build-type }}"
          # Bash 3.2 (macOS) + set -u treats an empty "${arr[@]}" as
          # unbound; use the ${arr[@]+…} form so Release/non-mingw is OK.
          PREPARE_ARGS=()
          if [ "${{ inputs.build-type }}" = "Debug" ]; then
            PREPARE_ARGS+=(-d)
          fi
          if [ "${{ inputs.toolchain }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
            PREPARE_ARGS+=(--mingw)
          elif [ "${{ inputs.c-compiler }}" != "cl" ]; then
            export CC="${{ inputs.c-compiler }}"
            export CXX="${{ inputs.cpp_compiler }}"
          fi
          ./prepare_cmake.sh ${PREPARE_ARGS[@]+"${PREPARE_ARGS[@]}"}

      - name: Build via build_cmake.sh
        shell: bash
        run: |
          set -euo pipefail
          export SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build"
          export SIS_CMAKE_CONFIG="${{ inputs.build-type }}"
          if [ "${{ inputs.toolchain }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
          fi
          ./build_cmake.sh

      - name: CTest via ctest_cmake.sh
        shell: bash
        run: |
          set -euo pipefail
          export SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build"
          export SIS_CMAKE_CONFIG="${{ inputs.build-type }}"
          if [ "${{ inputs.toolchain }}" = "mingw" ]; then
            export PATH="/mingw64/bin:$PATH"
          fi
          ./ctest_cmake.sh -M

      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build
          retention-days: 1

  # One post-build job per cell: sequential helper steps (taxonomy in the
  # log), one checkout / MinGW setup / artifact download — not five jobs.
  test:
    name: Tests (${{ inputs.cell-id }})
    needs: build
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        id: msys2
        if: runner.os == 'Windows' && inputs.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: sis-build-${{ inputs.cell-id }}
          path: build

      # download-artifact does not reliably restore Unix execute bits;
      # run_all_*.sh discovery requires -perm -100 (or *.exe on Windows).
      # Exclude CMakeFiles / *.d / *.o / *.obj so dependency sidecars are
      # not chmod'd and later mistaken for programs.
      - name: Restore execute bits on test and example binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          find build -type f \
            ! -path '*/CMakeFiles/*' \
            ! -name '*.d' \
            ! -name '*.o' \
            ! -name '*.obj' \
            \( \
              -name 'test_unit*' -o -name 'test.unit.*' -o \
              -name 'test_component*' -o -name 'test.component.*' -o \
              -name 'test_performance*' -o -name 'test.performance.*' -o \
              -name 'test_scratch*' -o -name 'test.scratch.*' -o \
              \( -name 'example*' ! -name '*.md' \) \
            \) -exec chmod +x {} +

      - name: Automated tests (unit then component) [non-Windows]
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" \
            ./run_all_automated_tests.sh -M

      - name: Automated tests (unit then component) [Windows]
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SIS_CMAKE_BUILD_DIR: ${{ github.workspace }}\build
        run: |
          if /I "${{ inputs.toolchain }}"=="mingw" set "PATH=%MSYS2_LOCATION%\mingw64\bin;%PATH%"
          call run_all_automated_tests.cmd
          if errorlevel 1 exit /b 1

      - name: Performance tests [non-Windows]
        if: runner.os != 'Windows'
        shell: bash
        env:
          SIS_PERFTESTS_GROUPGAPS: '1'
        run: |
          set -euo pipefail
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" \
            ./run_all_performance_tests.sh -M

      - name: Performance tests [Windows]
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SIS_CMAKE_BUILD_DIR: ${{ github.workspace }}\build
          SIS_PERFTESTS_GROUPGAPS: '1'
        run: |
          if /I "${{ inputs.toolchain }}"=="mingw" set "PATH=%MSYS2_LOCATION%\mingw64\bin;%PATH%"
          call run_all_performance_tests.cmd
          if errorlevel 1 exit /b 1

      - name: Scratch tests [non-Windows]
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" \
            ./run_all_scratch_tests.sh -M

      - name: Scratch tests [Windows]
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: cmd
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SIS_CMAKE_BUILD_DIR: ${{ github.workspace }}\build
        run: |
          if /I "${{ inputs.toolchain }}"=="mingw" set "PATH=%MSYS2_LOCATION%\mingw64\bin;%PATH%"
          call run_all_scratch_tests.cmd
          if errorlevel 1 exit /b 1

      - name: Examples [non-Windows]
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SIS_CMAKE_BUILD_DIR="${{ github.workspace }}/build" \
            ./run_all_examples.sh -M

      - name: Examples [Windows]
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SIS_CMAKE_BUILD_DIR: ${{ github.workspace }}\build
        run: |
          if /I "${{ inputs.toolchain }}"=="mingw" set "PATH=%MSYS2_LOCATION%\mingw64\bin;%PATH%"
          call run_all_examples.cmd
          if errorlevel 1 exit /b 1

      # CI stdout is not a terminal, so policy overrides are the only way to
      # exercise the emitting path; the plain path falls out for free.
      # Discovery matches run_all_examples.sh (exe or +x; no CMakeFiles).
      # find is allowed to exit non-zero: an early break closes the -print0
      # pipe and MSVC trees often have more than one match, so find's EPIPE
      # status must not abort the step under set -e (windows-cl exit 4).
      - name: Smoke-test colour policy
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.toolchain }}" = "mingw" ]; then
            MSYS_ROOT="${{ steps.msys2.outputs.msys2-location }}"
            MSYS_ROOT="${MSYS_ROOT//\\//}"
            export PATH="${MSYS_ROOT}/mingw64/bin:$PATH"
          fi

          locate_example()
          {
            name="$1"
            found=""
            while IFS= read -r -d '' candidate; do
              found="$candidate"
              break
            done < <(
              find build -type f \
                ! -path '*/CMakeFiles/*' \
                ! -name '*.d' \
                ! -name '*.o' \
                ! -name '*.obj' \
                \( -name "${name}.exe" -o -name "$name" \) \
                \( -name '*.exe' -o -perm -100 \) \
                -print0 2>/dev/null \
              || true
            )
            if [ -z "$found" ]; then
              echo "${name} executable not found under build/" >&2
              find build -type f \
                ! -path '*/CMakeFiles/*' \
                \( -name 'example*' ! -name '*.md' \) \
                >&2 || true
              return 1
            fi
            printf '%s\n' "$found"
          }

          colour=$(locate_example example.c.colour)
          colour_for=$(locate_example example.c.colour_for)
          echo "using colour=${colour}"
          echo "using colour_for=${colour_for}"

          esc=$(printf '\033')
          failures=0

          assert_colour()
          {
            desc="$1"; shift
            expect="$1"; shift

            set +e
            out="$("$@" 2>&1)"
            rc=$?
            set -e

            if [ "$rc" -ne 0 ]; then
              echo "FAIL: ${desc}: program exited ${rc}" >&2
              echo "$out" >&2
              failures=$((failures + 1))
              return 0
            fi

            case "$out" in
              *"$esc"*) actual=colour ;;
              *)        actual=plain ;;
            esac

            if [ "$actual" != "$expect" ]; then
              echo "FAIL: ${desc}: expected ${expect}, got ${actual}" >&2
              failures=$((failures + 1))
            else
              echo "ok: ${desc} (${actual})"
            fi
          }

          unset CLICOLOR CLICOLOR_FORCE NO_COLOR TERM WOAD_COLOR WOAD_COLOUR

          assert_colour "auto, not a tty"                        plain  "$colour_for"
          assert_colour "WOAD_COLOUR=always"                     colour env WOAD_COLOUR=always "$colour_for"
          assert_colour "WOAD_COLOUR=ALWAYS (case-insensitive)"  colour env WOAD_COLOUR=ALWAYS "$colour_for"
          assert_colour "WOAD_COLOR=1 (alternative spelling)"    colour env WOAD_COLOR=1 "$colour_for"
          assert_colour "CLICOLOR_FORCE=1"                       colour env CLICOLOR_FORCE=1 "$colour_for"
          assert_colour "WOAD_COLOUR=never beats CLICOLOR_FORCE" plain  env WOAD_COLOUR=never CLICOLOR_FORCE=1 "$colour_for"
          assert_colour "NO_COLOR beats CLICOLOR_FORCE"          plain  env NO_COLOR=1 CLICOLOR_FORCE=1 "$colour_for"
          assert_colour "WOAD_COLOUR=always beats NO_COLOR"      colour env WOAD_COLOUR=always NO_COLOR=1 "$colour_for"
          assert_colour "unbound macros ignore policy"           colour env NO_COLOR=1 "$colour"

          if [ "$failures" != "0" ]; then
            echo "${failures} colour-policy assertion(s) failed" >&2
            exit 1
          fi
